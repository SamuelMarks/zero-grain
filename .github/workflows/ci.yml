name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
      PDM_BUILD_SCM_VERSION: "2.2.0"
    defaults:
      run:
        working-directory: zero-grain
    steps:
    - name: Checkout zero-grain
      uses: actions/checkout@v7
      with:
        path: zero-grain

    - name: Checkout zero-jax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-jax
        path: zero-jax

    - name: Checkout zero-chex
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-chex
        path: zero-chex

    - name: Checkout zero-flax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-flax
        path: zero-flax

    - name: Checkout zero-optax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-optax
        path: zero-optax

    - name: Checkout zero-orbax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-orbax
        path: zero-orbax

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl"
        pip install "ml-switcheroo-compiler @ https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl"
        pip install "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        python -c "import pathlib, ml_switcheroo_compiler; (pathlib.Path(ml_switcheroo_compiler.__file__).parent / 'py.typed').touch()"
        pip install --no-deps -e ../zero-jax
        pip install --no-deps -e ../zero-chex
        pip install --no-deps -e ../zero-flax
        pip install --no-deps -e ../zero-optax
        pip install --no-deps -e ../zero-orbax
        pip install --no-deps -e .

    - name: Lint with Ruff
      run: |
        ruff format --check .
        ruff check .

    - name: Check Zero Runtime Dependencies (src/)
      run: |
        python3 scripts/check_deps.py src

    - name: Check Docstring Coverage (100%)
      run: |
        interrogate -vv -f 100 src scripts tests
        python3 scripts/check_docstrings.py src scripts tests

    - name: Check Typing Discipline & Mypy Strict
      run: |
        python3 scripts/check_typing_discipline.py src scripts tests
        mypy src scripts tests

    - name: Check API Snapshot & Test Completeness
      run: |
        python3 scripts/calc_compliance.py
        python3 scripts/check_compliance.py --strict-v005
        python3 scripts/check_test_completeness.py

    - name: Test with Pytest (100% Line & Branch Coverage)
      run: |
        pytest --cov=src --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100

    - name: Verify Badges are Updated
      run: |
        python3 scripts/update_badges.py
        if ! git diff --quiet README.md; then
          echo "Coverage badges in README.md are out of date."
          exit 1
        fi

    - name: Build Package
      run: python -m build
