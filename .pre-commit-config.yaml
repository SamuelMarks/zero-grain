repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Strict Type Check
        entry: mypy src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate Docstring Coverage (100%)
        entry: interrogate -vv -f 100 src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docstrings
        name: AST Docstring Check (Args & Returns)
        entry: python3 scripts/check_docstrings.py src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: check-typing-discipline
        name: AST Typing Discipline Check
        entry: python3 scripts/check_typing_discipline.py src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: check-test-completeness
        name: Check Exported API Test Completeness
        entry: python3 scripts/check_test_completeness.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-deps
        name: Check Zero Runtime Dependencies (src/)
        entry: python3 scripts/check_deps.py src
        language: system
        types: [python]
        pass_filenames: false

      - id: check-compliance
        name: Check API Snapshot Compliance
        entry: python3 scripts/calc_compliance.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-v005-compliance
        name: Check ml-ecosystem-snapshots v0.0.5 Minimum API & Plan Compliance
        entry: python3 scripts/check_compliance.py --strict-v005
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-cov
        name: Pytest (100% Line & Branch Coverage)
        entry: pytest --cov=src --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update README Badges
        entry: python3 scripts/update_badges.py
        language: system
        pass_filenames: false
